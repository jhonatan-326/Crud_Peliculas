<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix</title>
    <!-- Bootstrap CSS & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- 1. MENÚ DE NAVEGACIÓN (NAVBAR) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3">
        <div class="container-fluid">
            <!-- CineFlix en amarillo -->
            <span class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2 text-warning">
                <i class="bi bi-film"></i> CineFlix
            </span>
            
            <div id="nav-usuario-items" class="d-flex align-items-center gap-3" style="display: none !important;">
                <!-- Nombre de usuario en amarillo -->
                <span id="nombre-usuario" class="text-warning fw-bold fs-5"></span>

                <button type="button" class="btn btn-success fw-semibold rounded-3 px-3" data-bs-toggle="modal" data-bs-target="#modal-app" onclick="prepararModalCrear()">
                    <i class="bi bi-plus-circle-fill me-1"></i> Agregar Película
                </button>

                <button class="btn btn-danger fw-semibold rounded-3 px-3" id="btn-salir">Salir</button>
            </div>
        </div>
    </nav>

    <!-- 2. SECCIÓN DE LOGIN Y REGISTRO -->
    <section id="loginSection" class="login-container">
        <div class="login-card mx-auto p-4 border rounded-4 bg-white shadow-sm">
            <h2 class="text-center mb-4 text-dark fw-bold"><i class="bi bi-film"></i> CineFlix</h2>
            
            <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button" role="tab">
                        <i class="bi bi-person-plus"></i> Registro
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- TAB LOGIN -->
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="inputUser" class="form-label text-secondary">Usuario</label>
                            <input type="text" class="form-control" id="inputUser" placeholder="Ingrese usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword" class="form-label text-secondary">Contraseña</label>
                            <input type="password" class="form-control" id="inputPassword" placeholder="Ingrese contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
                    </form>
                </div>

                <!-- TAB REGISTRO -->
                <div class="tab-pane fade" id="registro" role="tabpanel">
                    <form id="formRegistro">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label text-secondary">Nombre Completo</label>
                            <input type="text" class="form-control" id="inputNombre" placeholder="Tu nombre completo" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label text-secondary">Email</label>
                            <input type="email" class="form-control" id="inputEmail" placeholder="tu@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputUserReg" class="form-label text-secondary">Usuario</label>
                            <input type="text" class="form-control" id="inputUserReg" placeholder="Nombre de usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputPasswordReg" class="form-label text-secondary">Contraseña</label>
                            <input type="password" class="form-control" id="inputPasswordReg" placeholder="Contraseña" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputConfirmPassword" class="form-label text-secondary">Confirmar Contraseña</label>
                            <input type="password" class="form-control" id="inputConfirmPassword" placeholder="Confirma tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Crear Cuenta</button>
                        <small class="d-block text-muted mt-3 text-center">
                            ¿Ya tienes cuenta? <a href="#" id="linkLogin" class="text-decoration-none">Vuelve al Login</a>
                        </small>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. DASHBOARD Y GRILLA DE PELÍCULAS -->
    <div id="dashboard" class="container my-4" style="display: none;">
        
        <!-- Sección del Carrusel de Películas Recientes -->
        <div class="my-4">
            <!-- Películas Recientes en blanco -->
            <h4 class="mb-3 text-white fw-bold">Películas Recientes</h4>
            
                   <div id="slider-pelicula" class="slider-container">
    <!-- Botón Izquierdo -->
           <button type="button" class="slider-btn" onclick="scrollSlider(-1)">&lt;</button>

    <!-- Contenedor de películas -->
                <div id="carruselMovies" class="carrusel-movies"></div>

    <!-- Botón Derecho -->
                   <button type="button" class="slider-btn" onclick="scrollSlider(1)">&gt;</button>
                </div>
        </div>

        <!-- Sección de Filtros -->
        <div class="my-4">
            <div class="row g-3">
                <!-- Buscador de texto -->
                <div class="col-md-6">
                    <input type="text" id="input-buscar" class="form-control form-control-lg border-0 shadow-sm" placeholder="Buscar película....">
                </div>
                
                <!-- Filtro por género -->
                <div class="col-md-6">
                    <select id="select-genero" class="form-select form-select-lg border-0 shadow-sm">
                        <option value="">Todos los géneros</option>
                        <option value="acción">Acción</option>
                        <option value="drama">Drama</option>
                        <option value="comedia">Comedia</option>
                        <option value="ciencia ficción">Ciencia ficción</option>
                        <option value="aventura">Aventura</option>
                        <option value="animado">Animado</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Sección de Todas las películas -->
        <div class="my-4">
            <h4 class="mb-3 text-white fw-bold">Todas las películas</h4>

            <div id="grid-peliculas" class="row g-4"></div>

            <div id="sin-resultados" class="alert alert-light text-center d-none mt-3 shadow-sm">
                <i class="bi bi-search"></i> No se encontraron películas
            </div>
        </div>
    </div>

    <!-- 4. MODAL CREAR / EDITAR PELÍCULA -->
    <div class="modal fade" id="modal-app" tabindex="-1" aria-labelledby="modalPeliculaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="modalPeliculaLabel">Agregar película</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-pelicula">
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Título</label>
                            <input type="text" id="input-titulo" class="form-control" placeholder="Título de la película" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Género</label>
                            <select id="input-genero" class="form-select" required>
                                <option value="">Seleccione género</option>
                                <option value="acción">Acción</option>
                                <option value="drama">Drama</option>
                                <option value="ciencia ficción">Ciencia ficción</option>
                                <option value="terror">Terror</option>
                                <option value="comedia">Comedia</option>
                                <option value="aventura">Aventura</option>
                                <option value="animado">Animado</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Director</label>
                            <input type="text" id="input-director" class="form-control" placeholder="Nombre del director" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary fw-semibold">Año</label>
                                <input type="number" id="input-ano" class="form-control" min="1900" max="2099" placeholder="2024" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary fw-semibold">Calificación (1-10)</label>
                                <input type="number" id="input-calificacion" class="form-control" min="1" max="10" step="0.1" placeholder="8.5" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">Descripción</label>
                            <textarea id="input-descripcion" class="form-control" rows="3" placeholder="Resumen de la película" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fw-semibold">URL de la imagen</label>
                            <input type="text" id="input-imagen" class="form-control" placeholder="https://..." required>
                        </div>

                        <div class="modal-footer px-0 pb-0 border-0 mt-4">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
                            <button type="submit" id="btn-guardar-pelicula" class="btn btn-primary px-4">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. MODAL DETALLES -->
    <div class="modal fade" id="modal-detalles" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title fw-bold" id="detalles-titulo">Título de la Película</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row g-4 align-items-center">
              <div class="col-md-5">
                <img id="detalles-imagen" src="" class="img-fluid rounded-3 shadow-sm w-100" alt="Poster">
              </div>
              <div class="col-md-7">
                <p class="mb-2"><b>Género:</b> <span id="detalles-genero" class="badge bg-secondary"></span></p>
                <p class="mb-2"><b>Director:</b> <span id="detalles-director"></span></p>
                <p class="mb-2"><b>Año:</b> <span id="detalles-ano"></span></p>
                <p class="mb-3"><b>Calificación:</b> <span id="detalles-calificacion" class="fw-bold text-warning"></span> ⭐</p>
                <p class="mb-1 fw-bold">Descripción:</p>
                <p id="detalles-descripcion" class="text-muted"></p>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
